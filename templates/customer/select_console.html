{% extends "base.html" %}
{% block title %}انتخاب کنسول | GameStore{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-8 fade-in">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold gradient-text mb-2">انتخاب کنسول</h1>
        <p class="text-gray-400">مدل کنسول، نوع و ظرفیت خود را انتخاب کنید</p>
    </div>

    <!-- Stage 1: Brand -->
    <div class="mb-6">
        <h2 class="text-lg font-bold text-purple-300 mb-3">۱. برند</h2>
        <div id="brands" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>

    <!-- Stage 2: Model -->
    <div class="mb-6 hidden" id="models-section">
        <h2 class="text-lg font-bold text-purple-300 mb-3">۲. مدل</h2>
        <div id="models" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>

    <!-- Stage 3: Capacity + Type -->
    <div class="mb-6 hidden" id="capacities-section">
        <h2 class="text-lg font-bold text-purple-300 mb-3">۳. نوع و ظرفیت</h2>
        <div id="capacities" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>

    <!-- Submit -->
    <form method="post" action="{% url 'consoles:save_capacity' %}" id="submit-form" class="hidden">
        {% csrf_token %}
        <input type="hidden" name="capacity_id" id="selected-capacity-id">
        <button type="submit"
                class="w-full bg-gradient-to-l from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-purple-900/50">
            ادامه به انتخاب بازی →
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
const brandsData = {{ brands_json|safe }};
const selectedCapacityId = {{ selected_capacity_id|default:"null" }};

let state = { brand: null, model: null, capacity: null };

function renderBrands() {
    const el = document.getElementById('brands');
    el.innerHTML = '';
    brandsData.forEach(b => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'p-4 rounded-xl border border-purple-900/40 bg-[#1A1A2E]/60 hover:border-purple-500 transition glow-card text-center font-bold';
        btn.textContent = b.name;
        btn.onclick = () => {
            state.brand = b; state.model = null; state.capacity = null;
            document.querySelectorAll('#brands button').forEach(x => x.classList.remove('border-cyan-400', 'bg-[#1A1A2E]'));
            btn.classList.add('border-cyan-400', 'bg-[#1A1A2E]');
            renderModels();
        };
        el.appendChild(btn);
    });
}

function renderModels() {
    const section = document.getElementById('models-section');
    const el = document.getElementById('models');
    el.innerHTML = '';
    if (!state.brand) return;
    section.classList.remove('hidden');
    state.brand.models.forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'p-4 rounded-xl border border-purple-900/40 bg-[#1A1A2E]/60 hover:border-purple-500 transition glow-card text-center';
        btn.textContent = m.name;
        btn.onclick = () => {
            state.model = m; state.capacity = null;
            document.querySelectorAll('#models button').forEach(x => x.classList.remove('border-cyan-400', 'bg-[#1A1A2E]'));
            btn.classList.add('border-cyan-400', 'bg-[#1A1A2E]');
            renderCapacities();
        };
        el.appendChild(btn);
    });
}

function renderCapacities() {
    const section = document.getElementById('capacities-section');
    const el = document.getElementById('capacities');
    el.innerHTML = '';
    document.getElementById('submit-form').classList.add('hidden');
    if (!state.model) return;
    section.classList.remove('hidden');
    state.model.capacities.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'p-4 rounded-xl border border-purple-900/40 bg-[#1A1A2E]/60 hover:border-cyan-400 transition glow-card text-right';
        btn.innerHTML = `
            <div class="flex justify-between items-center">
                <div>
                    <div class="font-bold">${c.type_name}</div>
                    <div class="text-sm text-gray-400">${c.nominal}GB (قابل استفاده: ${c.usable}GB)</div>
                </div>
                <div class="text-2xl">💾</div>
            </div>
        `;
        btn.onclick = () => {
            state.capacity = c;
            document.querySelectorAll('#capacities button').forEach(x => x.classList.remove('border-cyan-400', 'bg-[#1A1A2E]'));
            btn.classList.add('border-cyan-400', 'bg-[#1A1A2E]');
            document.getElementById('selected-capacity-id').value = c.id;
            document.getElementById('submit-form').classList.remove('hidden');
        };
        el.appendChild(btn);
    });
}

renderBrands();
</script>
{% endblock %}
